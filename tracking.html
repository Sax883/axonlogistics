<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Shipment - Axon Logistics</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1e40af;
            --secondary-color: #0284c7;
            --success-color: #10b981;
        }

        .tracking-hero {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 60px 0;
            text-align: center;
        }

        .tracking-hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .search-form {
            background: white;
            border-radius: 12px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .tracking-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .tracking-result {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        .shipment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            flex-wrap: wrap;
            gap: 15px;
        }

        .shipment-info h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .info-label {
            color: #6b7280;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .map-container {
            position: relative;
            margin: 30px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            height: 400px;
        }

        #trackingMap {
            width: 100%;
            height: 100%;
        }

        .satellite-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 400;
            background: white;
            border: 2px solid var(--secondary-color);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--secondary-color);
            font-size: 0.85rem;
        }

        .satellite-toggle:hover {
            background: var(--secondary-color);
            color: white;
        }

        .route-info {
            background: #f8fafc;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .compass {
            display: inline-block;
            width: 80px;
            height: 80px;
            background: white;
            border: 3px solid var(--secondary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2);
            margin: 15px auto;
        }

        .timeline {
            position: relative;
            margin: 30px 0;
        }

        .timeline-item {
            display: flex;
            margin-bottom: 20px;
        }

        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 4px solid white;
            box-shadow: 0 0 0 3px var(--primary-color);
            position: relative;
            z-index: 2;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .timeline-dot.completed {
            background: var(--success-color);
            box-shadow: 0 0 0 3px var(--success-color);
        }

        .timeline-content {
            flex: 1;
            padding: 10px 0;
        }

        .timeline-time {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .timeline-status {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .no-result {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 9999;
        }

        .notification.error {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-box"></i>
                <span>Axon Logistics</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="tracking.html">Track</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Tracking Hero -->
    <div class="tracking-hero">
        <div class="container">
            <h1><i class="fas fa-map-location-dot"></i> Track Your Shipment</h1>
            <p>Real-time tracking with satellite view</p>
            
            <div class="search-form">
                <div class="input-group">
                    <input type="text" class="form-control" id="trackingInput" placeholder="Enter tracking number (e.g., AXN300-2026-300)" autocomplete="off">
                    <button class="btn btn-primary" type="button" onclick="searchTracking()">
                        <i class="fas fa-search"></i> Track
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tracking Result -->
    <div class="tracking-container">
        <div id="trackingResult" style="display: none;">
            <div class="tracking-result">
                <div class="shipment-header">
                    <div class="shipment-info">
                        <h2 id="trackingNumber"></h2>
                        <div class="info-row">
                            <span class="info-label">From:</span>
                            <span id="origin"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">To:</span>
                            <span id="destination"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Sender:</span>
                            <span id="senderName"></span>
                        </div>
                    </div>
                    <span class="status-badge" id="statusBadge"></span>
                </div>

                <!-- Map -->
                <div class="map-container">
                    <div id="trackingMap"></div>
                    <button class="satellite-toggle" id="satelliteToggle" type="button">
                        <i class="fas fa-satellite"></i> Satellite
                    </button>
                </div>

                <!-- Route Info -->
                <div class="route-info">
                    <h5 style="margin-bottom: 15px; color: var(--primary-color); font-weight: 700;">
                        <i class="fas fa-compass"></i> Current Location & Direction
                    </h5>
                    <div style="text-align: center;">
                        <div class="location" style="justify-content: center; margin-bottom: 15px;">
                            <strong id="currentLocation">Loading...</strong> <strong id="directionText"></strong>
                        </div>
                        <div class="compass" id="compassDirection"><span style="font-size: 1.5rem;">↑</span><br><span style="font-size: 0.7rem;">N</span></div>
                    </div>
                </div>

                <!-- Timeline -->
                <h5 style="margin-top: 30px; color: var(--primary-color); font-weight: 700;">
                    <i class="fas fa-history"></i> Shipment Updates
                </h5>
                <div class="timeline" id="timeline"></div>
            </div>
        </div>

        <div id="noResult" class="no-result" style="display: none;">
            <i class="fas fa-inbox" style="font-size: 3rem; opacity: 0.3;"></i>
            <h3>No Shipment Found</h3>
            <p id="noResultMessage">Please check your tracking number and try again.</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/data-manager.js"></script>
    <script src="js/tracking-client.js"></script>
</body>
</html>

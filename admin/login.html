<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Axon Logistics</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1e40af;
            --secondary-color: #0284c7;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(30, 64, 175, 0.2);
        }

        .logo-icon i {
            font-size: 2.5rem;
            color: white;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: block;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(30, 64, 175, 0.2);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(30, 64, 175, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-login.loading .loading-spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .security-info {
            background: #f0f9ff;
            border-left: 4px solid var(--secondary-color);
            padding: 15px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #1e40af;
        }

        .security-info i {
            margin-right: 8px;
            color: var(--secondary-color);
        }

        .error-message {
            display: none;
            background: #fee;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .show-password {
            cursor: pointer;
            color: var(--secondary-color);
            user-select: none;
            font-weight: 500;
            position: relative;
            top: -35px;
            text-align: right;
            display: block;
            margin-bottom: -20px;
            font-size: 0.85rem;
        }

        .back-btn {
            text-align: center;
            margin-top: 20px;
        }

        .back-btn a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-btn a:hover {
            color: var(--primary-color);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 35px 25px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1>Admin Portal</h1>
                <p>Axon Logistics Secure Access</p>
            </div>

            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        placeholder="Enter your username"
                        autocomplete="on"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <span class="show-password" id="togglePassword">
                        <i class="fas fa-eye"></i> Show
                    </span>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="loading-spinner"></span>
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                <strong>Secure Connection:</strong> This login is encrypted and monitored for security.
            </div>

            <div class="back-btn">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script>
        const LoginManager = {
            // Credentials (as specified)
            VALID_USERNAME: 'axon_logistic',
            VALID_PASSWORD: 'ijoba081',
            
            // Session management
            SESSION_KEY: 'axon_admin_session',
            SESSION_TIMEOUT: 8 * 60 * 60 * 1000, // 8 hours in milliseconds

            init() {
                this.setupEventListeners();
                this.checkExistingSession();
            },

            setupEventListeners() {
                const form = document.getElementById('loginForm');
                const passwordInput = document.getElementById('password');
                const togglePasswordBtn = document.getElementById('togglePassword');

                form.addEventListener('submit', (e) => this.handleLogin(e));
                togglePasswordBtn.addEventListener('click', () => this.togglePasswordVisibility(passwordInput));

                // Clear error when user types
                document.getElementById('username').addEventListener('input', () => this.clearError());
                document.getElementById('password').addEventListener('input', () => this.clearError());
            },

            checkExistingSession() {
                const session = localStorage.getItem(this.SESSION_KEY);
                if (session) {
                    try {
                        const data = JSON.parse(session);
                        const now = Date.now();
                        if (data.timestamp + this.SESSION_TIMEOUT > now && data.authenticated === true) {
                            // Session is valid, redirect to dashboard
                            window.location.href = 'dashboard.html';
                            return;
                        }
                    } catch (e) {
                        localStorage.removeItem(this.SESSION_KEY);
                    }
                }
            },

            handleLogin(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const loginBtn = document.getElementById('loginBtn');

                // Validate input
                if (!username || !password) {
                    this.showError('Please enter both username and password');
                    return;
                }

                // Show loading state
                loginBtn.disabled = true;
                loginBtn.classList.add('loading');

                // Simulate network delay for security (0.5-1.5s)
                setTimeout(() => {
                    if (username === this.VALID_USERNAME && password === this.VALID_PASSWORD) {
                        this.loginSuccess();
                    } else {
                        this.loginFailure();
                    }
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                }, Math.random() * 1000 + 500);
            },

            loginSuccess() {
                // Create secure session
                const session = {
                    authenticated: true,
                    timestamp: Date.now(),
                    username: document.getElementById('username').value,
                    sessionId: this.generateSessionId()
                };

                localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 300);
            },

            loginFailure() {
                this.showError('Invalid username or password. Please try again.');
                document.getElementById('password').value = '';
                document.getElementById('username').focus();
            },

            showError(message) {
                const errorDiv = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');
                errorText.textContent = message;
                errorDiv.style.display = 'block';
            },

            clearError() {
                document.getElementById('errorMessage').style.display = 'none';
            },

            togglePasswordVisibility(input) {
                const btn = document.getElementById('togglePassword');
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide';
                } else {
                    input.type = 'password';
                    btn.innerHTML = '<i class="fas fa-eye"></i> Show';
                }
            },

            generateSessionId() {
                return 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
            }
        };

        // Initialize login manager when DOM is ready
        document.addEventListener('DOMContentLoaded', () => LoginManager.init());
    </script>
</body>
</html>
